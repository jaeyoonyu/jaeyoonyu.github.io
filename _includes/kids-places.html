{% raw %}
<style>
.kp { --line: rgba(128,128,128,.22); --muted: rgba(120,128,124,1); --accent: #1a7a5e; --today: rgba(26,122,94,.07);
  --th-bg: #fff; --hours: 10; font-size: 14px; line-height: 1.4;
  width: min(1100px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%); }
@media (prefers-color-scheme: dark) {
  .kp { --muted: #96a29b; --accent: #53c79e; --today: rgba(83,199,158,.09); --th-bg: #1d1f23; }
}
.kp * { box-sizing: border-box; }
.kp-status { font-size: 14px; margin-bottom: 8px; line-height: 1.6; }
.kp-status b { color: var(--accent); }
.kp-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.kp-sw { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; }

/* week: one block per day, one row per place */
.kp-day { display: grid; grid-template-columns: 96px 1fr; border-bottom: 1px solid var(--line); }
.kp-day.today { background: var(--today); }
.kp-dn { padding: 3px 0 3px 6px; font-weight: 700; font-size: 13px; align-self: center; }
.kp-dn small { font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 4px; }
.kp-day.today .kp-dn { color: var(--accent); }
.kp-rows { padding: 3px 0; }
.kp-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 22px; }
.kp-ln { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.kp-track { position: relative; height: 19px; background: rgba(128,128,128,.07); border-radius: 4px;
  background-image: repeating-linear-gradient(90deg, rgba(128,128,128,.16) 0 1px, transparent 1px calc(100% / var(--hours))); }
.kp-bar { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; color: #fff; font-size: 10.5px; font-weight: 600;
  display: flex; align-items: center; padding: 0 5px; overflow: hidden; white-space: nowrap; }
.kp-bar.past { opacity: .35; }
.kp-bar.extra { top: 4px; bottom: 4px; opacity: .8; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,.25) 0 3px, transparent 3px 7px); }
.kp-closed { position: absolute; left: 6px; top: 1px; font-size: 10.5px; color: var(--muted); }
.kp-axis { position: sticky; top: 0; z-index: 3; background: var(--th-bg); border-bottom: 1px solid var(--line); }
.kp-ticks { position: relative; height: 16px; font-size: 10.5px; color: var(--muted); }
.kp-ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; top: 1px; }
.kp-ticks span:first-child { transform: none; }
.kp-ticks span:last-child { transform: translateX(-100%); }
.kp-ticks span.kp-nowpill { transform: translateX(-50%); top: -1px; background: #ff3b30; color: #fff; font-weight: 700;
  padding: 0 6px; border-radius: 999px; z-index: 4; line-height: 16px; }
.kp-nowline { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1.5px; background: #ff3b30; z-index: 2;
  border-radius: 2px; box-shadow: 0 0 0 2px rgba(255,59,48,.22), 0 0 10px rgba(255,59,48,.75); }
.kp-nowline.ghost { width: 0; margin-left: 0; background: none; box-shadow: none; border-left: 1.5px dashed rgba(255,59,48,.55); }
.kp-scroll { overflow-x: auto; }
.kp-week { min-width: 720px; border-top: 1px solid var(--line); }

/* one card per place */
.kp-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 16px; }
.kp-card { border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.kp-card h4 { margin: 0 0 2px; font-size: 15px; }
.kp-card h4 a { color: inherit; }
.kp-card .city { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
.kp-card table { border-collapse: collapse; font-size: 12.5px; margin: 4px 0 6px; }
.kp-card td { padding: 0 12px 0 0; font-variant-numeric: tabular-nums; }
.kp-card td:first-child { color: var(--muted); }
.kp-card .note { color: var(--muted); font-size: 12px; line-height: 1.5; }
.kp-foot { color: var(--muted); font-size: 11.5px; margin-top: 12px; line-height: 1.7; }
</style>

<div class="kp" id="kp">
  <div class="kp-status" id="kp-status"></div>
  <div class="kp-legend" id="kp-legend"></div>
  <div class="kp-scroll" id="kp-scroll"><div class="kp-week" id="kp-week"></div></div>
  <div class="kp-cards" id="kp-cards"></div>
  <div class="kp-foot">
    Hours from each museum's own website, checked Oct 18, 2026.<br>
    Holiday and special hours vary; check the museum's site or Facebook before a long drive.<br>
    Striped bars are special sessions, such as Flint's Sensory Sunday.
  </div>
</div>

<script>
(() => {
  // Add a place by adding one entry. hours: Mon..Sun, each [open, close] in hours (13.5 = 1:30 PM) or null = closed.
  // extra: special sessions; `when(date)` decides whether it runs on a given date.
  const secondSunday = d => d.getDay() === 0 && d.getDate() >= 8 && d.getDate() <= 14;
  const PLACES = [
    { id: "mtp", name: "Mt. Pleasant Discovery Museum", city: "Mt. Pleasant", c: "#2a78d6",
      url: "https://mpdiscoverymuseum.org/visit", addr: "5093 E. Remus Rd., Mt. Pleasant", phone: "(989) 317-3221",
      hours: [[10, 18], [10, 18], [10, 18], [10, 18], [10, 18], [10, 18], [10, 18]],
      price: "$10 (12 months+) · seniors $8.50 · under 12 months free",
      note: "Open 7 days. Water Works, Beemazium, Farmers Market." },
    { id: "sag", name: "Mid-Michigan Children's Museum", city: "Saginaw", c: "#d9682b",
      url: "https://michildrensmuseum.org/", addr: "315 W. Genesee Ave., Saginaw", phone: "(989) 399-6626",
      hours: [null, [10, 16], [10, 16], [10, 16], [10, 16], [10, 17], [12, 16]],
      price: "$9 (ages 2–59) · seniors $8 · under 2 free",
      note: "Sundays open until June 1. Closed Thanksgiving, Christmas Eve & Day, Easter, Memorial Day." },
    { id: "fli", name: "Flint Children's Museum", city: "Flint", c: "#8e5bd6",
      url: "https://flintchildrensmuseum.org/admission/", addr: "1602 W. University Ave. (Kettering campus), Flint", phone: "(810) 767-5437",
      hours: [null, [10, 16], [10, 16], [10, 16], [10, 16], [10, 16], [12, 16]],
      extra: [{ day: 6, r: [10, 12], label: "Sensory Sunday", when: secondSunday }],
      price: "$8 adults and children · free parking",
      note: "Ages 0–8. Sensory Sunday (quiet hours) 10 AM–noon on the 2nd Sunday." },
  ];
  const T0 = 9, T1 = 19;  // axis 9 AM – 7 PM
  const DAYN = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  function t(h) {
    const hh = Math.floor(h), mm = Math.round((h - hh) * 60), ap = hh >= 12 ? "PM" : "AM", h12 = hh % 12 || 12;
    return mm ? `${h12}:${String(mm).padStart(2, "0")} ${ap}` : `${h12} ${ap}`;
  }
  const short = h => t(h).replace(":00", "").replace(" AM", "a").replace(" PM", "p");
  const label = r => { const a = short(r[0]), b = short(r[1]); return a.slice(-1) === b.slice(-1) ? `${a.slice(0, -1)}–${b}` : `${a}–${b}`; };
  const pct = h => ((h - T0) / (T1 - T0)) * 100;

  let now, nowH, dow, dates;
  function clock() {
    now = new Date(); nowH = now.getHours() + now.getMinutes() / 60; dow = (now.getDay() + 6) % 7;
    dates = DAYN.map((_, i) => new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow + i));
  }

  function status() {
    const open = PLACES.filter(p => p.hours[dow] && nowH >= p.hours[dow][0] && nowH < p.hours[dow][1]);
    const lines = [];
    if (open.length) lines.push("<b>Open now</b> · " + open.map(p => `${esc(p.city)} until ${t(p.hours[dow][1])}`).join(" · "));
    else {
      // the next place to open, today or later this week
      for (let k = 0; k < 8 && lines.length === 0; k++) {
        const d = (dow + k) % 7;
        const c = PLACES.filter(p => p.hours[d] && (k > 0 || p.hours[d][0] > nowH)).sort((a, b) => a.hours[d][0] - b.hours[d][0])[0];
        if (c) lines.push(`All closed now · next: <b>${k === 0 ? "today" : k === 1 ? "tomorrow" : DAYN[d]} ${t(c.hours[d][0])}</b> (${esc(c.city)})`);
      }
    }
    $("kp-status").innerHTML = lines.join("<br>");
  }

  function renderWeek() {
    const ticks = [];
    for (let h = T0; h <= T1; h++) ticks.push(`<span style="left:${pct(h)}%">${short(h)}</span>`);
    const inRange = nowH > T0 && nowH < T1;
    const pill = inRange ? `<span class="kp-nowpill" style="left:${pct(nowH)}%">Now ${short(nowH)}</span>` : "";
    let html = `<div class="kp-day kp-axis"><div></div><div class="kp-rows"><div class="kp-row"><div></div><div class="kp-ticks">${pill}${ticks.join("")}</div></div></div></div>`;
    DAYN.forEach((dn, d) => {
      const isToday = d === dow;
      const rows = PLACES.map(p => {
        const h = p.hours[d];
        const bars = [];
        if (h) bars.push(`<div class="kp-bar${isToday && nowH >= h[1] ? " past" : ""}" style="left:${pct(h[0])}%;width:${pct(h[1]) - pct(h[0])}%;background:${p.c}"
          title="${esc(`${p.name}: ${t(h[0])} – ${t(h[1])}`)}">${label(h)}</div>`);
        (p.extra || []).filter(x => x.day === d && x.when(dates[d])).forEach(x => bars.push(
          `<div class="kp-bar extra" style="left:${pct(x.r[0])}%;width:${pct(x.r[1]) - pct(x.r[0])}%;background:${p.c}"
            title="${esc(`${x.label}: ${t(x.r[0])} – ${t(x.r[1])}`)}">${esc(x.label)}</div>`));
        const nowline = inRange ? `<div class="kp-nowline${isToday ? "" : " ghost"}" style="left:${pct(nowH)}%"></div>` : "";
        return `<div class="kp-row"><div class="kp-ln">${esc(p.city)}</div>
          <div class="kp-track">${h ? "" : `<span class="kp-closed">Closed</span>`}${bars.join("")}${nowline}</div></div>`;
      }).join("");
      html += `<div class="kp-day ${isToday ? "today" : ""}"><div class="kp-dn">${dn}<small>${isToday ? "today" : `${dates[d].getMonth() + 1}/${dates[d].getDate()}`}</small></div>
        <div class="kp-rows">${rows}</div></div>`;
    });
    $("kp-week").innerHTML = html;
  }

  function renderCards() {
    $("kp-legend").innerHTML = PLACES.map(p => `<span><span class="kp-sw" style="background:${p.c}"></span>${esc(p.city)}</span>`).join("");
    $("kp-cards").innerHTML = PLACES.map(p => {
      const rows = DAYN.map((dn, d) => `<tr><td>${dn}</td><td>${p.hours[d] ? `${t(p.hours[d][0])} – ${t(p.hours[d][1])}` : "Closed"}</td></tr>`).join("");
      return `<div class="kp-card" style="--c:${p.c}"><h4><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)} ↗</a></h4>
        <div class="city">${esc(p.addr)} · ${esc(p.phone)}</div><table>${rows}</table>
        <div class="note">${esc(p.price)}<br>${esc(p.note)}</div></div>`;
    }).join("");
  }

  clock(); status(); renderWeek(); renderCards();
  setInterval(() => {
    const d0 = dow; clock();
    if (dow !== d0) return location.reload();  // past midnight
    status(); renderWeek();
  }, 60 * 1000);
  document.addEventListener("keydown", e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || !$("kp").offsetParent || e.ctrlKey || e.metaKey) return;
    const s = $("kp-scroll");
    if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && s.scrollWidth > s.clientWidth) {
      e.preventDefault(); s.scrollBy({ left: e.key === "ArrowLeft" ? -160 : 160, behavior: "smooth" });
    }
  });
})();
</script>
{% endraw %}
