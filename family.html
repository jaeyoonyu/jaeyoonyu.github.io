---
layout: page
title: "Family"
permalink: /family/
sitemap: false
---
{% raw %}
<style>
.fam { --line: rgba(128,128,128,.25); --muted: rgba(120,128,124,1);
  width: min(1240px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%);
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
@media (prefers-color-scheme: dark) { .fam { --muted: #96a29b; } }
@media (max-width: 600px) { .fam { grid-template-columns: 1fr; } }
.fam button { text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 14px 18px; cursor: pointer;
  background: transparent; color: inherit; font: inherit; border-left: 5px solid var(--c); }
.fam button:hover { border-color: var(--c); }
.fam button b { display: block; font-size: 19px; }
.fam button span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.fam button.on { background: var(--c); border-color: var(--c); color: #fff; }
.fam button.on span { color: rgba(255,255,255,.85); }
.fam-panel[hidden] { display: none; }

/* Midland weather: current conditions + the next 24 hours, live from Open-Meteo */
.wx { --line: rgba(128,128,128,.25); --muted: rgba(120,128,124,1); --rain: #2a78d6;
  width: min(1240px, calc(100vw - 32px)); position: relative; left: 50%; transform: translateX(-50%);
  border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
@media (prefers-color-scheme: dark) { .wx { --muted: #96a29b; --rain: #6aa9f0; } }
@media (max-width: 600px) { .wx { grid-template-columns: 1fr; gap: 8px; } }
.wx-now { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.wx-now .ic { font-size: 34px; line-height: 1; }
.wx-now .t { font-size: 30px; font-weight: 700; line-height: 1; }
.wx-now .d { font-size: 12.5px; line-height: 1.45; }
.wx-now .d small { display: block; color: var(--muted); font-size: 11.5px; }
.wx-hours { display: flex; overflow-x: auto; gap: 2px; scrollbar-width: thin; padding-bottom: 2px; }
.wx-h { flex: none; width: 46px; text-align: center; font-size: 11.5px; line-height: 1.35; padding: 3px 0; border-radius: 7px;
  font-variant-numeric: tabular-nums; }
.wx-h.now { background: rgba(128,128,128,.13); font-weight: 700; }
.wx-h .hr { color: var(--muted); font-size: 10.5px; }
.wx-h .hi { font-size: 18px; line-height: 1.3; }
.wx-h .pp { color: var(--rain); font-size: 10.5px; min-height: 14px; }
.wx-h .fl { color: var(--muted); font-size: 10.5px; }
.wx-legend { color: var(--muted); font-size: 10.5px; margin-top: 2px; }
.wx-h.day0 { border-left: 1px solid var(--line); border-radius: 0 7px 7px 0; }
.wx-err { color: var(--muted); font-size: 12.5px; }
</style>
<div class="wx" id="wx"><div class="wx-err">Loading Midland weather…</div></div>
<div class="fam" id="fam">
  <button data-sec="meals" style="--c:#1a7a5e"><b>School Meals</b><span>Woodcrest breakfast &amp; lunch, by week</span></button>
  <button data-sec="center" style="--c:#2a78d6"><b>Community Center</b><span>Swim, pickleball, basketball, kids' programs</span></button>
</div>
{% endraw %}
<div class="fam-panel" id="fam-meals" hidden>
{% include school-menu.html %}
</div>
<div class="fam-panel" id="fam-center" hidden>
{% include community-center.html %}
</div>
{% raw %}
<script>
(() => {
  // Each section keeps its own state in the hash: #meals/2026-10-12, #center/swim.
  const SECS = ["meals", "center"];
  const btns = [...document.querySelectorAll("#fam button")];
  function show(sec) {
    SECS.forEach(s => { document.getElementById("fam-" + s).hidden = s !== sec; });
    btns.forEach(b => b.classList.toggle("on", b.dataset.sec === sec));
    try { sec ? localStorage.setItem("fam-sec", sec) : localStorage.removeItem("fam-sec"); } catch (e) {}
  }
  const fromHash = () => SECS.find(s => location.hash.slice(1).split("/")[0] === s);
  document.getElementById("fam").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.classList.contains("on")) {  // a second click closes the section
      history.replaceState(null, "", location.pathname + location.search);
      show(null);
    } else {
      history.replaceState(null, "", "#" + b.dataset.sec);
      window.dispatchEvent(new HashChangeEvent("hashchange"));
      show(b.dataset.sec);
    }
  };
  window.addEventListener("hashchange", () => { const s = fromHash(); if (s) show(s); });
  let last = null;
  try { last = localStorage.getItem("fam-sec"); } catch (e) {}
  show(fromHash() || (SECS.includes(last) ? last : null));
})();

// ---- Midland weather (Open-Meteo: free, no key, allows browser requests) ----
(() => {
  const URL = "https://api.open-meteo.com/v1/forecast?latitude=43.6156&longitude=-84.2472" +
    "&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,is_day" +
    "&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,is_day" +
    "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
    "&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FDetroit&forecast_days=3";
  // WMO weather codes -> [day icon, night icon, words]
  function wmo(c) {
    if (c === 0) return ["☀️", "🌙", "Clear"];
    if (c === 1) return ["🌤️", "🌙", "Mostly clear"];
    if (c === 2) return ["⛅", "☁️", "Partly cloudy"];
    if (c === 3) return ["☁️", "☁️", "Cloudy"];
    if (c === 45 || c === 48) return ["🌫️", "🌫️", "Fog"];
    if (c >= 51 && c <= 57) return ["🌦️", "🌧️", "Drizzle"];
    if (c >= 61 && c <= 67) return ["🌧️", "🌧️", c >= 66 ? "Freezing rain" : "Rain"];
    if (c >= 71 && c <= 77) return ["🌨️", "🌨️", "Snow"];
    if (c >= 80 && c <= 82) return ["🌦️", "🌧️", "Showers"];
    if (c === 85 || c === 86) return ["🌨️", "🌨️", "Snow showers"];
    if (c >= 95) return ["⛈️", "⛈️", "Thunderstorm"];
    return ["🌡️", "🌡️", ""];
  }
  const icon = (c, day) => wmo(c)[day ? 0 : 1];
  const hr = s => { const h = +s.slice(11, 13); return `${h % 12 || 12}${h < 12 ? "a" : "p"}`; };
  const R = Math.round;

  async function load() {
    const el = document.getElementById("wx");
    try {
      const w = await (await fetch(URL)).json();
      const c = w.current, h = w.hourly, d = w.daily;
      // Hourly times are local Midland time; start at the current hour.
      const start = Math.max(0, h.time.findIndex(t => t.slice(0, 13) === c.time.slice(0, 13)));
      const hours = [];
      for (let i = start; i < Math.min(start + 24, h.time.length); i++) {
        const p = h.precipitation_probability[i];
        const newDay = i > start && h.time[i].slice(11, 13) === "00";
        hours.push(`<div class="wx-h${i === start ? " now" : ""}${newDay ? " day0" : ""}" title="${wmo(h.weather_code[i])[2]}">
          <div class="hr">${i === start ? "Now" : newDay ? new Date(h.time[i]).toLocaleDateString("en-US", { weekday: "short" }) : hr(h.time[i])}</div>
          <div class="hi">${icon(h.weather_code[i], h.is_day[i])}</div>
          <div>${R(h.temperature_2m[i])}°</div>
          <div class="fl" title="Feels like">${R(h.apparent_temperature[i])}°</div>
          <div class="pp">${p >= 10 ? p + "%" : ""}</div></div>`);
      }
      const rain = d.precipitation_probability_max[0];
      el.innerHTML = `<div class="wx-now"><span class="ic">${icon(c.weather_code, c.is_day)}</span><span class="t">${R(c.temperature_2m)}°</span>
        <div class="d"><b>${wmo(c.weather_code)[2]}</b> · Midland<small>Feels ${R(c.apparent_temperature)}° · wind ${R(c.wind_speed_10m)} mph</small>
        <small>Today ${R(d.temperature_2m_max[0])}° / ${R(d.temperature_2m_min[0])}°${rain >= 10 ? ` · rain ${rain}%` : ""}</small></div></div>
        <div style="min-width:0"><div class="wx-hours">${hours.join("")}</div><div class="wx-legend">Each hour: temperature, feels like (gray), chance of rain (blue)</div></div>`;
    } catch (e) {
      el.innerHTML = `<div class="wx-err">Midland weather isn't available right now.</div>`;
    }
  }
  load();
  setInterval(load, 15 * 60 * 1000);  // every 15 minutes while the page is open
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
})();
</script>
{% endraw %}
