name: Refresh market snapshot

on:
  schedule:
    # 4:10 pm Eastern, right after the close. Cron runs in UTC, so both 20:10 (summer, EDT) and
    # 21:10 (winter, EST) are listed; a run before 4 pm Eastern keeps the previous close and commits
    # nothing. GitHub may delay or skip scheduled runs (it did during the Nov 25, 2026 outage), so
    # later runs that evening are backups; each commits only if the numbers changed.
    - cron: "10 20,21,22,23 * * 1-5"
    - cron: "10 1 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet finance-datareader
      - run: python _code/market_snapshot.py
      - name: Commit if the numbers changed
        run: |
          # The "updated" stamp changes every run; only commit when the numbers did (not on market holidays).
          if git diff --quiet -I 'Last run [0-9-]* [0-9:]* UTC' -- _includes/market-snapshot.html; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add _includes/market-snapshot.html
          git commit -m "Refresh market snapshot"
          git pull --rebase
          git push
